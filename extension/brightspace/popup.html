<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Brightspace material</title>
<link rel="stylesheet" href="style.css"><style>body{width:420px;max-height:560px;overflow:auto}</style></head>
<body><div class="wrap">
  <div class="head"><h1>New on Brightspace</h1><button class="btn ghost small" id="rescan">Check now</button></div>
  <div class="small muted" id="status">Checking…</div>
  <div id="list"></div>
  <div class="row" id="actions" hidden>
    <button class="btn primary" id="add">Add to CognitioFlow</button>
    <button class="btn ghost" id="skip" title="Remember these as handled without downloading them">I already have these</button>
    <span class="small muted" id="count"></span>
  </div>
  <div class="row"><a href="#" id="opts" class="small muted">Options</a></div>
</div><script src="popup.js" type="module"></script></body></html>
