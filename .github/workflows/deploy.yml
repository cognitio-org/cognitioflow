# Tests every PR and every push to main against a throwaway Neon branch of production,
# then (main only) builds the image, pushes it to Artifact Registry and deploys Cloud Run.
#
# Repo variables: GCP_WIF_PROVIDER, GCP_DEPLOY_SA (printed by infra/setup.sh), NEON_PROJECT_ID,
#                 optional NEON_DATABASE (default cognitioflow), NEON_ROLE (default neondb_owner).
# Repo secrets:   NEON_API_KEY. No GCP key: GitHub's OIDC token is exchanged via Workload Identity Federation.
name: test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the sha for pushes, not on the ref: GitHub holds only one queued run per group, so a
# burst of merges to main used to evict each other. On 16 Sep five merges (#23, #26, #27, #28, #29)
# were cancelled that way and reached main untested. Deploys keep their own group, below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT: vigilant-axis-483119-r8
  REGION: europe-west4
  SERVICE: cognitioflow
  IMAGE: europe-west4-docker.pkg.dev/vigilant-axis-483119-r8/cognitioflow/cognitioflow
  RUN_SA: cognitioflow-run@vigilant-axis-483119-r8.iam.gserviceaccount.com
  BACKUP_JOB: cognitioflow-backup
  BACKUP_IMAGE: europe-west4-docker.pkg.dev/vigilant-axis-483119-r8/cognitioflow/backup
  BACKUP_SA: cognitioflow-backup@vigilant-axis-483119-r8.iam.gserviceaccount.com

jobs:
  # Fail fast. The same suite against a Postgres beside the runner finishes in about a minute; against
  # a Neon branch it takes eighteen, because every query in every test crosses to Frankfurt and back.
  # A pull request that is simply broken should not spend a Neon branch and eighteen minutes to find
  # that out. Nothing is given up: the Neon job below still runs on every green PR, still gates the
  # deploy, and is still what proves a migration applies to real production data.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16   # Phase 10's embeddings need the vector extension; the stock image has none
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: cognitioflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cf -d cognitioflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: make test
        env:
          DATABASE_URL: postgresql://cf:cf@localhost:5432/cognitioflow
          AUTH: "off"
          ALLOWED_EMAILS: matej@mgms.eu
          ANTHROPIC_API_KEY: sk-ant-test-key
          STORAGE: local
          PYTEST_ADDOPTS: --durations=15
        run: make test

      # The extension ships its own node tests and nothing was running them, so a
      # regression there would have reached the browser silently. No install step:
      # it has no dependencies, and `node --test` is the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: extension tests
        working-directory: extension/pr-watcher
        run: node --test

  test:
    needs: fast          # a broken PR has already failed, a minute in, without touching Neon
    runs-on: ubuntu-latest
    timeout-minutes: 35   # make test against a Neon branch took 19m47s on 2026-09-17; 20 left no headroom
    env:
      NEON_DATABASE: ${{ vars.NEON_DATABASE || 'cognitioflow' }}
      NEON_ROLE: ${{ vars.NEON_ROLE || 'neondb_owner' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the scope step diffs against the base

      # `fast` already ran this exact `make test` against a pgvector container in 1-3 minutes.
      # This job re-runs it against a Neon branch: 21-22 minutes, almost all network to
      # eu-central-1. That only earns its time when the change could behave differently against
      # production's own database. #74, #75, #78 and #79 were CI and lint changes and each paid
      # 21 minutes to re-prove what `fast` proved two minutes earlier.
      #
      # The job still runs and still reports, so the required check is never left pending. It just
      # stops before touching Neon when no database-facing file changed.
      - name: Does this change reach the database?
        id: scope
        env:
          # pull_request gives base/head directly; push gives the previous head of the branch.
          # Until 2026-09-19 only the pull_request pair was read, so BASE was empty on every
          # push and the job fell straight through to db=true. The measured cost of that: the
          # same commit took 2 minutes as a PR and 26-37 minutes on main, and the deploy is
          # gated behind the main run. #82 was five PNGs and #83 a .glb, and each waited half
          # an hour to reach users for a suite `fast` had already proved.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A first push to a branch, or a force push, reports an all-zero before-sha. That is
          # not a range we can diff, so fall open and run everything.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::no usable base sha; running in full"
              echo "db=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || {
            echo "::notice::base sha $BASE is not in this checkout; running in full"
            echo "db=true" >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$BASE" "$HEAD") || { echo "::notice::diff failed; running in full"; echo "db=true" >> "$GITHUB_OUTPUT"; exit 0; }
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE '^(migrations/|run\.py|storage\.py|retrieval\.py|embed\.py|schedule\.py|oral\.py|essay\.py|course_brief\.py|tts\.py|migrate.*\.py|requirements\.txt|Dockerfile|\.github/workflows/)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no database-facing files changed; fast already proved this suite"
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.db == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.scope.outputs.db == 'true'

      - name: Branch expiry (safety net if the delete step never runs)
        if: steps.scope.outputs.db == 'true'
        id: expiry
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch of production
        if: steps.scope.outputs.db == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ env.NEON_DATABASE }}
          role: ${{ env.NEON_ROLE }}
          expires_at: ${{ steps.expiry.outputs.at }}

      # The action does not mask its db_url/password outputs, so fetch the URI here and mask it
      # before anything can print it.
      - name: Connection string (masked)
        if: steps.scope.outputs.db == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          uri=$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=$NEON_DATABASE&role_name=$NEON_ROLE&pooled=false" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["uri"])')
          echo "::add-mask::$uri"
          echo "DATABASE_URL=$uri" >> "$GITHUB_ENV"

      - name: make test
        if: steps.scope.outputs.db == 'true'
        env:
          AUTH: "off"
          ALLOWED_EMAILS: matej@mgms.eu
          ANTHROPIC_API_KEY: sk-ant-test-key
          STORAGE: local
          PYTEST_ADDOPTS: --durations=15   # the slowest tests, so the next speed-up is aimed, not guessed
        run: make test

      # A direct API call: neondatabase/delete-branch-action (v3.2.1 included) still pins setup-node v4,
      # which runs on the deprecated Node 20.
      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $NEON_API_KEY" -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID"
          echo "Deleted Neon branch $BRANCH_ID"

  # PR worthiness: one short comment on every PR — Approve/Hold, one-line explanation, security %.
  # The checker is taken from main (base sha), so a PR cannot rewrite its own reviewer; it never runs PR code.
  # Optional repo secret ANTHROPIC_API_KEY adds a Claude review on top of the rules.
  worthiness:
    needs: [fast, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: it posts a comment, it does not judge the code. Run #42 passed every test and was
    # still marked red because this job died at start-up, so a failure here must not gate the run.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts/pr_worthiness.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assess and comment
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_CHECK_MODEL: ${{ vars.PR_CHECK_MODEL }}
          # When fast fails, test is skipped — report the failure that actually happened rather than
          # telling the author their tests "did not run".
          TESTS: ${{ needs.test.result == 'skipped' && needs.fast.result || needs.test.result }}
          PR: ${{ github.event.pull_request.number }}
          # The commit TESTS actually belongs to. If the head has moved on since, this run's verdict
          # is about a commit that is no longer the head, so it stands down for that commit's own run.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/pr_worthiness.py ]; then
            echo "::notice::scripts/pr_worthiness.py is not on main yet; the check starts on PRs opened after it merges"; exit 0
          fi
          if [ -n "$ANTHROPIC_API_KEY$OPENROUTER_API_KEY" ]; then pip install -q anthropic; fi
          python scripts/pr_worthiness.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --tests "$TESTS" --post

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every merge now gets its own test run; deploys still take turns here, and a deploy still
    # waiting when a newer one arrives gives way to it, so the newest commit is what goes live.
    concurrency:
      group: ${{ github.workflow }}-deploy-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUN_SA" \
            --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 1Gi --concurrency 20 \
            --min-instances 0 --max-instances 2 --cpu-boost \
            --set-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest \
            --set-env-vars CF_COMMIT=${GITHUB_SHA:0:12},ENV=production,STORAGE=gcs,GCS_BUCKET=cognitioflow-user-content,GCP_PROJECT=vigilant-axis-483119-r8,STT=hosted,STT_PROVIDER=google,STT_REGION=europe-west4,TTS=edge,EDGE_VOICE=en-GB-RyanNeural,VOICE_DIALOG_MODEL=gemini-live-2.5-flash-native-audio,VOICE_DIALOG_LOCATION=europe-west4,ALLOWED_EMAILS=matej@mgms.eu \
            --labels "commit=${GITHUB_SHA:0:12}" \
            --quiet

      - name: Smoke test /health
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format='value(status.url)')
          echo "Service URL: $url"
          for _ in 1 2 3 4 5; do
            curl -fsS -o /dev/null -w "health %{http_code} in %{time_total}s\n" "$url/health" && exit 0  # not /healthz: reserved by Cloud Run
            sleep 5
          done
          echo "/health did not return 200" >&2; exit 1

      # The weekly backup (scripts/backup.py) as a Cloud Run job, kept on the same commit as the app.
      # Skipped until infra/backup.sh --apply has created its service account; the schedule lives in that script.
      - name: Deploy backup job
        run: |
          if ! gcloud iam service-accounts describe "$BACKUP_SA" --project "$GCP_PROJECT" >/dev/null 2>&1; then
            echo "::notice::$BACKUP_SA not found - run infra/backup.sh --apply; backup job not deployed"; exit 0
          fi
          docker build --platform linux/amd64 -f infra/backup/Dockerfile -t "$BACKUP_IMAGE:$GITHUB_SHA" .
          docker push "$BACKUP_IMAGE:$GITHUB_SHA"
          gcloud run jobs deploy "$BACKUP_JOB" \
            --project "$GCP_PROJECT" --region "$REGION" \
            --image "$BACKUP_IMAGE:$GITHUB_SHA" \
            --service-account "$BACKUP_SA" \
            --tasks 1 --max-retries 1 --task-timeout 3600s --cpu 1 --memory 1Gi \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --set-env-vars SOURCE_BUCKET=cognitioflow-user-content,BACKUP_BUCKET=cognitioflow-backups,GCP_PROJECT=vigilant-axis-483119-r8 \
            --labels "commit=${GITHUB_SHA:0:12}" \
            --quiet
