# Arm / disarm GitHub auto-merge from the `automerge` label.
# GitHub performs the actual merge only after main's required checks
# (fast, test, worthiness) pass — this job just arms it. No label = manual,
# which keeps auth/schema/tags/money PRs a human decision.
#
# The label means "the council reviewed THIS head". So:
#   labeled automerge      -> arm, pinned to the head the label was put on (--match-head-commit),
#                             only if the PR has no hold label, is not a draft, and has not moved since.
#   synchronize (a push)   -> if labelled: disarm AND remove `automerge`; the council must re-review the
#                             new head and re-label it. (Before this, a push RE-ARMED auto-merge — that is
#                             how #200 merged code the council never saw.)
#   labeled hold           -> disarm.   unlabeled automerge -> disarm.   converted_to_draft -> disarm.
#   opened / reopened / ready_for_review never arm: arming needs a fresh `automerge` label event.
#
# Fork safety: pull_request_target runs with a write token, so this job NEVER checks out or runs PR
# code. It only calls the GitHub API with the PR number/URL from the event payload (passed via env,
# never interpolated into the script).
name: automerge

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, converted_to_draft]

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    # Only the events that matter start a job (other labels do nothing — and, being skipped, do not
    # enter the concurrency group below, so they cannot cancel an in-flight disarm).
    if: >-
      github.event.action == 'synchronize' ||
      github.event.action == 'converted_to_draft' ||
      (github.event.action == 'labeled' && github.event.label.name == 'automerge') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'automerge') ||
      (github.event.action == 'labeled' && contains(fromJSON('["hold","on-hold","on hold","on_hold","do-not-merge","do not merge","do_not_merge","dont-merge","dont merge"]'), github.event.label.name))
    runs-on: ubuntu-latest
    # One run per PR at a time; a newer event cancels an older in-flight run, so an older "arm" can
    # never land after a newer "disarm". Every run also re-reads the live PR state before acting.
    concurrency:
      group: automerge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Arm under a PAT (AUTODEPLOY_PAT) rather than GITHUB_TOKEN. Why: when GitHub completes an
      # auto-merge enabled by GITHUB_TOKEN, the resulting push to main is attributed to the Actions bot,
      # and GitHub does NOT trigger downstream workflows from a GITHUB_TOKEN push (anti-recursion) — so
      # deploy.yml (on: push main) never fires and the merge sits undeployed until a manual
      # deploy-catchup kick. Arming it under a real PAT attributes the merge to that user, so the push
      # DOES trigger deploy.yml. Falls back to GITHUB_TOKEN when the secret is unset or invalid.
      # The PAT is fine-grained, this repo only, Contents:write + Pull requests:write.
      # Disarming and label removal use GITHUB_TOKEN first (its events trigger no workflows, so the
      # label removal cannot start another run), falling back to the PAT only to disarm.
      - name: Arm or disarm auto-merge
        env:
          PAT: ${{ secrets.AUTODEPLOY_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --- automerge-reconcile:begin ---
          set -euo pipefail
          MERGE_LABEL=automerge

          read_state() {
            # Live PR state (never the event payload, which can be stale): line 1 draft, 2 head sha,
            # 3 armed (auto_merge set), then one label per line.
            local s
            s="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$REPO/pulls/$PR_NUMBER" \
                  --jq '(.draft|tostring), .head.sha, ((.auto_merge != null)|tostring), .labels[].name')"
            DRAFT="$(printf '%s\n' "$s" | sed -n 1p)"
            HEAD_SHA="$(printf '%s\n' "$s" | sed -n 2p)"
            ARMED="$(printf '%s\n' "$s" | sed -n 3p)"
            LABELS="$(printf '%s\n' "$s" | sed -n '4,$p')"
          }
          has_label() { printf '%s\n' "$LABELS" | grep -Fxq -- "$1"; }
          # Same hold set as the council: lower-cased, spaces/underscores folded to '-'.
          held() {
            printf '%s\n' "$LABELS" | tr '[:upper:]' '[:lower:]' | sed -E 's/[[:space:]_]+/-/g' \
              | grep -Exq "hold|on-hold|do-not-merge|dont-merge|don't-merge"
          }

          disarm() {
            if [ "$ARMED" != true ]; then
              echo "auto-merge is not armed — nothing to disarm ($1)"
              return 0
            fi
            echo "disarming auto-merge: $1"
            if ! GH_TOKEN="$GITHUB_TOKEN" gh pr merge --disable-auto "$PR_URL"; then
              if [ -n "$PAT" ]; then
                echo "::warning::GITHUB_TOKEN could not disarm — retrying with AUTODEPLOY_PAT"
                GH_TOKEN="$PAT" gh pr merge --disable-auto "$PR_URL"
              else
                echo "::error::could not disarm auto-merge on #$PR_NUMBER"; exit 1
              fi
            fi
            read_state
            if [ "$ARMED" = true ]; then
              echo "::error::auto-merge on #$PR_NUMBER is STILL armed after --disable-auto"; exit 1
            fi
            echo "disarmed"
          }

          read_state
          echo "event=$EVENT_ACTION label=${EVENT_LABEL:-} draft=$DRAFT armed=$ARMED head=$HEAD_SHA"

          case "$EVENT_ACTION" in
            synchronize)
              if has_label "$MERGE_LABEL"; then
                # Disarm first: if this run is cancelled after this point, the merge is already off.
                disarm "new push to a labelled PR — the council has not reviewed $HEAD_SHA"
                if ! GH_TOKEN="$GITHUB_TOKEN" gh api -X DELETE \
                      "repos/$REPO/issues/$PR_NUMBER/labels/$MERGE_LABEL" >/dev/null; then
                  read_state
                  if has_label "$MERGE_LABEL"; then
                    echo "::error::could not remove the '$MERGE_LABEL' label from #$PR_NUMBER"; exit 1
                  fi
                fi
                echo "removed '$MERGE_LABEL' — the council must re-review the new head and re-label"
              else
                # Not labelled: leave any human-armed auto-merge alone.
                echo "no '$MERGE_LABEL' label — nothing to do"
              fi
              ;;
            unlabeled)
              disarm "'$MERGE_LABEL' label removed"
              ;;
            converted_to_draft)
              disarm "converted to draft"
              ;;
            labeled)
              if [ "$EVENT_LABEL" != "$MERGE_LABEL" ]; then
                disarm "hold label '$EVENT_LABEL' added"
              elif held; then
                disarm "PR carries a hold label — not arming"
              elif [ "$DRAFT" = true ]; then
                disarm "PR is a draft — not arming"
              elif ! has_label "$MERGE_LABEL"; then
                echo "'$MERGE_LABEL' already removed again — not arming"
              elif [ "$HEAD_SHA" != "$EVENT_HEAD_SHA" ]; then
                echo "head moved since the label was added ($EVENT_HEAD_SHA -> $HEAD_SHA) — not arming"
              else
                # Pin to the labelled head: GitHub refuses if the head has moved since.
                if [ -n "$PAT" ] && GH_TOKEN="$PAT" gh pr merge --auto --squash \
                      --match-head-commit "$EVENT_HEAD_SHA" "$PR_URL"; then
                  echo "armed with AUTODEPLOY_PAT at $EVENT_HEAD_SHA — the merge will trigger deploy.yml"
                else
                  echo "::warning::AUTODEPLOY_PAT missing or invalid — falling back to GITHUB_TOKEN; the merge will NOT trigger deploy (relies on deploy-catchup.yml)."
                  GH_TOKEN="$GITHUB_TOKEN" gh pr merge --auto --squash \
                    --match-head-commit "$EVENT_HEAD_SHA" "$PR_URL"
                  echo "armed with GITHUB_TOKEN at $EVENT_HEAD_SHA"
                fi
              fi
              ;;
            *)
              echo "event '$EVENT_ACTION' is not handled — nothing to do"
              ;;
          esac
          # --- automerge-reconcile:end ---
